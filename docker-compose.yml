version: '3.8'

services:
  redis:
    image: redis:alpine
    container_name: finops-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - finops-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  finops-api:
    build:
      context: ./src/backend
      dockerfile: FinOps.Api/Dockerfile
    container_name: finops-risk-api
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__Redis=redis:6379
      # Must come from a local .env / shell env var named OPENAI_API_KEY.
      # If unset, MultiAgentRiskCoordinator's chat calls will fail at runtime
      # (not at container start) the first time a transaction scores >= 0.85 -
      # check this first if SAR investigations error out but everything else
      # (scoring, dashboard alerts) works fine.
      - OpenAI__ApiKey=${OPENAI_API_KEY}
      - OpenAI__ModelId=gpt-4o
    volumes:
      - sqlite-data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - finops-net

  # Note: finops-api does not depend_on dynamodb-local. This is intentional -
  # DynamoDbFeatureStore writes are wrapped in a timeout + swallowed exception
  # in HighRiskTransactionListener.cs, so the live scoring/dashboard pipeline
  # keeps working even if this container is slow to start or unavailable.
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: finops-dynamodb
    ports:
      - "8000:8000"
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath ./data"
    volumes:
      - dynamodb-data:/home/dynamodblocal/data
    restart: unless-stopped
    networks:
      - finops-net

volumes:
  redis-data:
  sqlite-data: # Docker manages this externally, just like redis-data
  dynamodb-data:

networks:
  finops-net:
    driver: bridge